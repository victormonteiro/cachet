[phases.setup]
nixPkgs = [
  "...",
  "php84Packages.composer",
  "php84Extensions.bcmath",
  "php84Extensions.bz2",
  "php84Extensions.calendar",
  "php84Extensions.dba",
  "php84Extensions.curl",
  "php84Extensions.ctype",
  "php84Extensions.dom",
  "php84Extensions.enchant",
  "php84Extensions.exif",
  "php84Extensions.fileinfo",
  "php84Extensions.gd",
  "php84Extensions.gettext",
  "php84Extensions.gmp",
  "php84Extensions.iconv",
  "php84Extensions.imagick",
  "php84Extensions.imap",
  "php84Extensions.intl",
  "php84Extensions.mbstring",
  "php84Extensions.openssl",
  "php84Extensions.opcache",
  "php84Extensions.pdo",
  "php84Extensions.pdo_mysql",
  "php84Extensions.pdo_pgsql",
  "php84Extensions.redis",
  "php84Extensions.rdkafka",
  "php84Extensions.tokenizer",
  "php84Extensions.xml",
  "php84Extensions.zip",
  "imagemagick",
  "python311Packages.supervisor",
  "nodejs_22",
  "nginx"
]

[phases.build]
cmds = [
    "npm run build",
    "mkdir -p /var/log /var/log/nginx",
    "mkdir -p /app/bootstrap/cache",
    "chmod -R 755 /app/bootstrap/cache",
    "chown -R root:root /app/bootstrap/cache",
    "mkdir -p /etc/supervisor/conf.d/",
    "cp /assets/worker-*.conf /etc/supervisor/conf.d/",
    "cp /assets/supervisord.conf /etc/supervisord.conf",
    "chmod +x /assets/start.sh",
    "..."
]

[start]
cmd = "/assets/start.sh"

[staticAssets]
"start.sh" = '''
#!/bin/bash

# Raise file descriptor limit for all supervised processes.
TARGET_NOFILE="${RLIMIT_NOFILE:-65535}"
ulimit -n "${TARGET_NOFILE}" || true

# Optionally run migrations at boot (dev opt-in)
if [[ "${RUN_MIGRATIONS}" == "true" ]]; then
  php artisan migrate --force --no-interaction || exit 1
fi

# Note: HTTPS is handled by Cloudflare Tunnel, no need for SSL certificates here

# Force HTTPS detection for Laravel assets
if [[ "${FORCE_HTTPS}" == "true" ]]; then
  echo "Forcing HTTPS detection for Laravel..."
  # Ensure APP_URL uses HTTPS
  export APP_URL="${APP_URL/http:/https:}" 2>/dev/null || true
fi

# Transform the nginx configuration
node /assets/scripts/prestart.mjs /assets/nginx.template.conf /etc/nginx.conf

# Ensure bootstrap/cache directory exists and has correct permissions
mkdir -p /app/bootstrap/cache
chmod -R 755 /app/bootstrap/cache

# Clear Laravel caches
php artisan storage:link
php artisan optimize:clear
php artisan filament:optimize-clear
php artisan icons:cache

# Customers-only containers serve the web panel only (no queue workers)
if [[ "${IS_CUSTOMERS_ONLY}" == "true" ]]; then
  rm -f /etc/supervisor/conf.d/worker-laravel-horizon.conf
fi

# Start supervisor (manages nginx, php-fpm, queues)
exec supervisord -c /etc/supervisord.conf -n
'''

"supervisord.conf" = '''
[unix_http_server]
file=/assets/supervisor.sock

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/assets/supervisord.pid
nodaemon=false
silent=false
minfds=65535
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///assets/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

"worker-nginx.conf" = '''
[program:worker-nginx]
process_name=%(program_name)s_%(process_num)02d
command=nginx -c /etc/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-nginx.log
stderr_logfile=/var/log/worker-nginx.log
'''

"worker-phpfpm.conf" = '''
[program:worker-phpfpm]
process_name=%(program_name)s_%(process_num)02d
command=php-fpm -y /assets/php-fpm.conf -F
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-phpfpm.log
stderr_logfile=/var/log/worker-phpfpm.log
'''

"worker-laravel-horizon.conf" = '''
[program:worker-laravel-horizon]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan horizon'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
startsecs=0
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/worker-laravel-horizon.log
'''

"worker-laravel-schedule.conf" = '''
[program:worker-laravel-schedule]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan schedule:work'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=0
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/worker-laravel-schedule.log
'''

"worker-laravel-reverb.conf" = '''
[program:worker-laravel-reverb]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan reverb:start'
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/worker-laravel-reverb.log
'''

"php-fpm.conf" = '''
[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 50
pm.min_spare_servers = 4
pm.max_spare_servers = 32
pm.start_servers = 18
clear_env = no

php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 120
php_admin_value[max_input_time] = 120
php_admin_value[post_max_size] = 256M
php_admin_value[upload_max_filesize] = 256M
php_admin_value[date.timezone] = America/Sao_Paulo
'''

"nginx.template.conf" = '''
user www-data www-data;
worker_processes auto;
daemon off;

worker_rlimit_nofile 65535;

events {
  worker_connections  65535;
  multi_accept on;
}

http {
    include    $!{nginx}/conf/mime.types;
    index    index.html index.htm index.php;

    default_type application/octet-stream;
    # Enhanced log format for Cloudflare Tunnel
    log_format   main '$remote_addr - $remote_user [$time_local]  $status '
        '"$request" $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for" '
        '"$http_cf_connecting_ip" "$http_cf_ray"';
    access_log /var/log/nginx-access.log;
    error_log /var/log/nginx-error.log;
    sendfile     on;
    tcp_nopush   on;
    server_names_hash_bucket_size 128; # this seems to be required for some vhosts
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # HTTP server block (HTTPS handled by Cloudflare Tunnel)
    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        $if(NIXPACKS_PHP_ROOT_DIR) (
            root ${NIXPACKS_PHP_ROOT_DIR};
        ) else (
            root /app/public;
        )
        
        set_real_ip_from 10.0.0.0/8;

        real_ip_header CF-Connecting-IP;

        # Security headers
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        
        # Cloudflare Tunnel proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;
        
        # Ensure HTTPS detection for Laravel (Cloudflare Tunnel compatible)
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
        fastcgi_param HTTP_CF_RAY $http_cf_ray;
        fastcgi_param HTTP_CF_VISITOR $http_cf_visitor;

        client_max_body_size 512M;
     
        index index.php;
     
        charset utf-8;
     

        $if(NIXPACKS_PHP_FALLBACK_PATH) (
            location / {
                try_files $uri $uri/ ${NIXPACKS_PHP_FALLBACK_PATH}?$query_string;
            }
        ) else (
          location / {
                try_files $uri $uri/ /index.php?$query_string;
           }
        )
     
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }
     
        $if(IS_LARAVEL) (
            error_page 404 /index.php;
        ) else ()
     
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            # FastCGI optimizations
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;

            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
        }
     
        location ~ /\.(?!well-known).* {
            deny all;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
        }

        # Deny access to sensitive files
        location ~* \.(env|log|sql|md|txt|yml|yaml)$ {
            deny all;
        }

    }
}
'''


